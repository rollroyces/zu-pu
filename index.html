<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-t="title">族譜 · zu-pu</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <h1 data-t="brand">族譜</h1>
    <span class="sub" data-t="subtitle">生命路徑族譜 · v1</span>
  </div>
  <nav class="tabs">
    <button class="tab-btn active" data-view="tree" data-t="tab.tree">家系圖</button>
    <button class="tab-btn" data-view="people" data-t="tab.people">人物</button>
    <button class="tab-btn" data-view="lab" data-t="tab.lab">研究室</button>
  </nav>
  <div class="lang-wrap">
    <label data-t="lang.label" class="lang-label">語言</label>
    <select id="langSelect" class="lang-select">
      <option value="zh-Hant">繁體中文</option>
      <option value="zh-Hans">简体中文</option>
      <option value="en">English</option>
      <option value="ko">한국어</option>
      <option value="ja">日本語</option>
      <option value="vi">Tiếng Việt</option>
      <option value="fr">Français</option>
      <option value="th">ไทย</option>
      <option value="es">Español</option>
    </select>
  </div>
</header>

<main class="layout">

  <section id="viewTree" class="view">
    <div class="view-header">
      <h2 data-t="tree.title">家系圖</h2>
      <p class="muted" data-t="tree.hint">選擇祖先，調整世代與方向，觀察像素頭像與親屬關係。</p>
    </div>

    <div class="tree-controls">
      <label>
        <span data-t="tree.root">根節點</span>
        <select id="treeRoot"></select>
      </label>
      <label>
        <span data-t="tree.mode">方向</span>
        <select id="treeMode">
          <option value="descendant" data-t="tree.descendant">子孫</option>
          <option value="ancestor" data-t="tree.ancestor">祖先</option>
          <option value="both" data-t="tree.both">雙向</option>
        </select>
      </label>
      <label>
        <span data-t="tree.depth">世代數</span>
        <select id="treeDepth">
          <option value="2" data-t="tree.g2">2 世代</option>
          <option value="3" selected data-t="tree.g3">3 世代</option>
          <option value="4" data-t="tree.g4">4 世代</option>
          <option value="5" data-t="tree.g5">5 世代</option>
        </select>
      </label>
    </div>

    <div id="treeSvg" class="tree-svg-wrap"></div>

    <div class="legend">
      <span class="lg-item"><span class="lg-swatch swatch-m"></span><span data-t="legend.m">男</span></span>
      <span class="lg-item"><span class="lg-swatch swatch-f"></span><span data-t="legend.f">女</span></span>
      <span class="lg-item"><span class="lg-swatch swatch-d"></span><span data-t="legend.d">已歿</span></span>
    </div>
  </section>

  <section id="viewPeople" class="view" style="display:none">
    <div class="view-header">
      <h2 data-t="people.title">人物列表</h2>
      <p class="muted" data-t="people.hint">點選查看個人資料卡。</p>
    </div>
    <div id="peopleList" class="people-list"></div>
  </section>

  <section id="viewPerson" class="view" style="display:none">
    <div class="view-header">
      <button class="back-btn" onclick="document.getElementById('viewPerson').style.display='none';document.getElementById('viewPeople').style.display='block'" data-t="action.back">← 返回人物列表</button>
    </div>
    <div id="personCardWrap"></div>
  </section>

  <section id="viewLab" class="view" style="display:none">
    <div class="view-header">
      <h2 class="lab-title" data-t="lab.title">研究室</h2>
      <p class="lab-sub" data-t="lab.sub">統計總人數、平均年齡、世代分布與出生年代直方圖。</p>
    </div>
    <div class="lab-controls">
      <button id="labRun" data-t="lab.run">重新統計</button>
    </div>
    <div id="lab-results" class="lab-results"></div>
  </section>

</main>

<footer class="foot">
  <span data-t="foot.note">族譜 v1 · 9 語言 · SVG 頭像 · Lab 模式 · 本機儲存</span>
</footer>

<script src="app.js"></script>
</body>
</html>
